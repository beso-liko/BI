<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 48" fill="none">
  <!--
    BI Holding Group — favicon mark
    Construction: 50×48 grid, 4 px margins, all strokes on integer grid.

    B: 6 px spine + 6 px bars + 6 px right wall  (white)
       Upper counter 14×10 px, lower counter 14×12 px (larger lower lobe = proper B anatomy)
    gap: 4 px transparent
    I: 8 px stem + 2 px serif overhang each side  (red)
  -->

  <!-- B spine -->
  <rect x="4"  y="4"  width="6"  height="40" fill="#F5F5F5"/>
  <!-- B top bar -->
  <rect x="4"  y="4"  width="26" height="6"  fill="#F5F5F5"/>
  <!-- B mid bar -->
  <rect x="4"  y="20" width="26" height="6"  fill="#F5F5F5"/>
  <!-- B bot bar -->
  <rect x="4"  y="38" width="26" height="6"  fill="#F5F5F5"/>
  <!-- B upper-right wall (closes upper counter) -->
  <rect x="24" y="10" width="6"  height="10" fill="#F5F5F5"/>
  <!-- B lower-right wall (closes lower counter, 2 px taller = asymmetric lobes) -->
  <rect x="24" y="26" width="6"  height="12" fill="#F5F5F5"/>

  <!-- I stem -->
  <rect x="36" y="4"  width="8"  height="40" fill="#D71920"/>
  <!-- I top serif -->
  <rect x="34" y="4"  width="12" height="6"  fill="#D71920"/>
  <!-- I bot serif -->
  <rect x="34" y="38" width="12" height="6"  fill="#D71920"/>
</svg>
